<style>

/* ── Roster Summary Strip ─────────────────────── */
.roster-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 2rem;
}
.rs-card {
  background: rgba(255,255,255,0.03);
  border: 0.5px solid rgba(240,234,248,0.07);
  border-radius: 10px;
  padding: 14px 16px;
  text-align: center;
}
.rs-val {
  font-family: 'Oswald', sans-serif;
  font-size: 30px; color: var(--gold); line-height: 1;
}
.rs-lbl {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: rgba(240,234,248,0.3);
  text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px;
}

/* ── Filter Row ───────────────────────────────── */
.filter-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 1.75rem;
}
.filter-btn {
  padding: 6px 16px; border-radius: 10px;
  border: 0.5px solid rgba(240,234,248,0.1);
  background: transparent;
  color: rgba(240,234,248,0.4);
  font-family: 'DM Sans', sans-serif; font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
.filter-btn:hover { color: #fff; border-color: rgba(240,234,248,0.3); }
.filter-btn.active {  border-color: var(--purple); color: var(--gold); }

/* ── Section Divider ──────────────────────────── */
.roster-section-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 2rem 0 1rem;
}
.rsd-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--gold);
  text-transform: uppercase; letter-spacing: 0.14em;
  white-space: nowrap;
}
.rsd-line { flex: 1; height: 0.5px; background: rgba(253,208,35,0.2); }
.rsd-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: rgba(255,255,255,0.25);
  white-space: nowrap;
}

/* ── Roster Grid ──────────────────────────────── */
.roster-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ── Player Card ──────────────────────────────── */
.player-card {
  background: rgba(255,255,255,0.02);
  border: 0.5px solid rgba(240,234,248,0.08);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
  cursor: pointer;
}
.player-card:hover { border-color: rgba(253,208,35,0.3); }
.player-card.transfer { border-left: 2px solid var(--gold); }
.player-card.returning { border-left: 2px solid var(--purple); }
.player-card.hidden { display: none; }

.card-top {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px 18px 14px;
}
.card-num {
  font-family: 'Oswald', sans-serif;
  font-size: 42px; color: rgba(253,208,35,0.18);
  line-height: 1; min-width: 44px; text-align: center;
  flex-shrink: 0;
}
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-family: 'Oswald', sans-serif;
  font-size: 20px; color: #fff; line-height: 1;
  letter-spacing: 0.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-role {
  font-size: 12px; color: rgba(240,234,248,0.4);
  margin-top: 3px; font-weight: 300; line-height: 1.4;
}
.card-badges {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;
}
.card-badge {
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: rgba(240,234,248,0.42);
  background: rgba(240,234,248,0.07);
  border: 0.5px solid rgba(240,234,248,0.08);
  border-radius: 4px; padding: 2px 7px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.card-badge.gold { color: var(--gold); background: rgba(253,208,35,0.08); border-color: rgba(253,208,35,0.2); }
.card-badge.purple { color: #c9a8ff; background: rgba(59,31,106,0.3); border-color: rgba(59,31,106,0.5); }

/* ── Stat Strip (always visible) ─────────────── */
.card-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 0.5px solid rgba(255,255,255,0.06);
  padding: 10px 18px;

.cs-item { text-align: center; }

  margin-top: 3px;

/* ── Expanded Detail Panel ────────────────────── */

.ebr-lbl {
  font-family: 'DM Mono', monospace; font-size: 10px;
  color: rgba(255,255,255,0.35); min-width: 40px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
.ebr-track {
  flex: 1; height: 3px;
  background: rgba(240,234,248,0.07); border-radius: 10px; overflow: hidden;
}
.ebr-fill {
  height: 100%; border-radius: 10px;
  background: linear-gradient(90deg, var(--purple), var(--gold));
  transition: width 0.5s ease;
}
.ebr-val {
  font-family: 'DM Mono', monospace; font-size: 11px;
  color: rgba(240,234,248,0.6); min-width: 32px; text-align: right;

.expand-note {
  font-size: 12px; color: rgba(255,255,255,0.35);
  line-height: 1.6; font-weight: 300;
  padding-top: 8px;
  border-top: 0.5px solid rgba(240,234,248,0.07);

.expand-toggle {
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  padding: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: rgba(255,255,255,0.25);
  text-transform: uppercase; letter-spacing: 0.08em;
  border-top: 0.5px solid rgba(240,234,248,0.07);
  transition: color 0.15s;
}
.player-card:hover .expand-toggle { color: rgba(240,234,248,0.42); }
.toggle-arrow { transition: transform 0.2s; font-size: 10px; }
.toggle-arrow.open { transform: rotate(180deg); }

/* ── Transfer badge on card ───────────────────── */
.transfer-from {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 9px; color: rgba(253,208,35,0.6);
  margin-top: 4px;
}
.tf-arrow { color: var(--gold); }

@media (max-width: 600px) {
  .roster-grid { grid-template-columns: 1fr; }
}

// ── Efficiency Score ──────────────────────────────────────────────────────────
function calcEff(p) {
  const fgBonus = p.fgpct ? (p.fgpct - 40) * 0.15 : 0;
  const raw = (p.ppg * 1.0) + (p.rpg * 0.7) + (p.apg * 0.8) +
              (p.spg * 1.2) + (p.bpg * 1.0) - (p.tpg * 0.8) + fgBonus;
  return Math.min(100, Math.max(0, Math.round(((raw - 5) / 23) * 100)));
}

// ── Render Summary Strip ──────────────────────────────────────────────────────
function renderSummary() {
  const total = RETURNING.length + TRANSFERS.length;
  const guards = [...RETURNING, ...TRANSFERS].filter(p => p.posGroup === 'G').length;
  const forwards = [...RETURNING, ...TRANSFERS].filter(p => p.posGroup === 'F').length;
  const centers = [...RETURNING, ...TRANSFERS].filter(p => p.posGroup === 'C').length;
  const avgPpg = ([...RETURNING, ...TRANSFERS].reduce((a,p) => a + p.ppg, 0) / total).toFixed(1);

  document.getElementById('roster-summary').innerHTML = `
    <div class="rs-card"><div class="rs-val">${total}</div><div class="rs-lbl">Total Players</div></div>
    <div class="rs-card"><div class="rs-val">${RETURNING.length}</div><div class="rs-lbl">Returning</div></div>
    <div class="rs-card"><div class="rs-val">${TRANSFERS.length}</div><div class="rs-lbl">Transfers In</div></div>
    <div class="rs-card"><div class="rs-val">${guards}</div><div class="rs-lbl">Guards</div></div>
    <div class="rs-card"><div class="rs-val">${forwards}</div><div class="rs-lbl">Forwards</div></div>
    <div class="rs-card"><div class="rs-val">${centers}</div><div class="rs-lbl">Centers</div></div>
    <div class="rs-card"><div class="rs-val">${avgPpg}</div><div class="rs-lbl">Avg PPG (prev)</div></div>
  `;
}

  const id = `card-${type}-${index}`;

  const fromHtml = p.from ? `<div class="transfer-from"><span class="tf-arrow">→</span> From ${p.from}</div>` : '';

  const statusBadge = type === 'transfer'
    ? `<span class="card-badge gold">Incoming Transfer</span>`
    : `<span class="card-badge purple">${p.year}</span>`;

  return `
    <div class="player-card ${type}" id="${id}" data-pos="${p.posGroup}" data-type="${type}" onclick="toggleCard('${id}')">
      <div class="card-top">
        <div class="card-num">${p.num}</div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-role">${p.role}</div>
          ${fromHtml}
          <div class="card-badges">
            ${statusBadge}
            <span class="card-badge">${p.pos}</span>
            <span class="card-badge">${p.ht}</span>
            <span class="card-badge">EFF ${eff}</span>
          </div>
        </div>
      </div>

      <!-- Quick stat strip -->
      <div class="card-stats">
        <div class="cs-item"><div class="cs-val">${p.ppg}</div><div class="cs-lbl">PPG</div></div>
        <div class="cs-item"><div class="cs-val">${p.rpg}</div><div class="cs-lbl">RPG</div></div>
        <div class="cs-item"><div class="cs-val">${p.apg}</div><div class="cs-lbl">APG</div></div>
        <div class="cs-item"><div class="cs-val">${p.spg}</div><div class="cs-lbl">SPG</div></div>
        <div class="cs-item"><div class="cs-val">${p.fgpct}%</div><div class="cs-lbl">FG%</div></div>
      </div>

      <!-- Expanded panel -->

          <div class="eg-item"><div class="eg-val">${p.mpg}</div><div class="eg-lbl">MPG</div></div>
          <div class="eg-item"><div class="eg-val">${p.bpg}</div><div class="eg-lbl">BPG</div></div>
          <div class="eg-item"><div class="eg-val">${p.tpg}</div><div class="eg-lbl">TPG</div></div>
          <div class="eg-item"><div class="eg-val">${p.totPts}</div><div class="eg-lbl">Tot Pts</div></div>
          <div class="eg-item"><div class="eg-val">${p.totReb}</div><div class="eg-lbl">Tot Reb</div></div>
          <div class="eg-item"><div class="eg-val">${p.totAst}</div><div class="eg-lbl">Tot Ast</div></div>
          <div class="eg-item"><div class="eg-val">${p.totStl}</div><div class="eg-lbl">Tot Stl</div></div>
        </div>

        <div class="expand-bar-section">
          ${makeBar('PPG', p.ppg, 20)}
          ${makeBar('FG%', p.fgpct, 65)}
          ${p.tppct > 0 ? makeBar('3PT%', p.tppct, 55) : ''}
          ${makeBar('FT%', p.ftpct, 100)}
        </div>

        <div class="expand-note">${p.note}</div>
      </div>

      <div class="expand-toggle">
        <span>Stats</span>
        <span class="toggle-arrow" id="arrow-${id}">▾</span>
      </div>
    </div>
  `;
}

function makeBar(label, val, max) {
  const pct = Math.min(100, Math.round((val / max) * 100));
  return `<div class="expand-bar-row">
    <span class="ebr-lbl">${label}</span>
    <div class="ebr-track"><div class="ebr-fill" style="width:${pct}%"></div></div>
    <span class="ebr-val">${val}${label.includes('%') ? '%' : ''}</span>
  </div>`;
}

function toggleCard(id) {
  const expand = document.getElementById(`expand-${id}`);
  const arrow  = document.getElementById(`arrow-${id}`);
  expand.classList.toggle('open');
  arrow.classList.toggle('open');
}

// ── Render Grids ──────────────────────────────────────────────────────────────
function renderGrids() {
  document.getElementById('returning-grid').innerHTML =
    RETURNING.map((p, i) => buildCard(p, 'returning', i)).join('');
  document.getElementById('transfer-grid').innerHTML =
    TRANSFERS.map((p, i) => buildCard(p, 'transfer', i)).join('');
  document.getElementById('returning-count').textContent = `${RETURNING.length} players`;
  document.getElementById('transfer-count').textContent  = `${TRANSFERS.length} players`;
}

// ── Filter ────────────────────────────────────────────────────────────────────
function filterRoster(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const cards = document.querySelectorAll('.player-card');
  cards.forEach(card => {
    const type = card.dataset.type;
    const pos  = card.dataset.pos;
    let show = false;
    if (filter === 'all') show = true;
    else if (filter === 'returning') show = type === 'returning';
    else if (filter === 'transfer')  show = type === 'transfer';
    else if (filter === 'G') show = pos === 'G';
    else if (filter === 'F') show = pos === 'F';
    else if (filter === 'C') show = pos === 'C';
    card.classList.toggle('hidden', !show);
  });

  // Show/hide section headers based on visible cards
  const hasReturning = [...document.querySelectorAll('.player-card.returning')].some(c => !c.classList.contains('hidden'));
  const hasTransfer  = [...document.querySelectorAll('.player-card.transfer')].some(c => !c.classList.contains('hidden'));
  document.getElementById('returning-divider').style.display = hasReturning ? '' : 'none';
  document.getElementById('transfer-divider').style.display  = hasTransfer  ? '' : 'none';
}

// ── Nav ───────────────────────────────────────────────────────────────────────
function toggleNav() {
  const links = document.getElementById('topnav-links');
  const btn   = document.getElementById('nav-hamburger');
  links.classList.toggle('open');
  btn.classList.toggle('open');
}
document.querySelectorAll('.topnav-links a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('topnav-links').classList.remove('open');
    document.getElementById('nav-hamburger').classList.remove('open');
  });
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderSummary();
renderGrids();
</script>
</body>
</html>
