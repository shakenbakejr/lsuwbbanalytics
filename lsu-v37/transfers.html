// ── Efficiency Score (same formula as analytics page) ──
function calcEff(p) {
  const fgBonus = p.fgpct ? (p.fgpct - 40) * 0.15 : 0;
  const raw = (p.ppg * 1.0) + (p.rpg * 0.7) + (p.apg * 0.8) +
              (p.spg * 1.2) + (p.bpg * 1.0) - (p.tpg * 0.8) + fgBonus;
  return Math.min(100, Math.max(0, Math.round(((raw - 5) / 23) * 100)));
}

let charts = {};

function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

          <tr>
            <th>Player</th>
            <th>PPG</th><th>RPG</th><th>APG</th><th>SPG</th><th>BPG</th><th>FG%</th>
          </tr>
        </thead>
        <tbody>
          <tr class="highlight-row">
            <td class="ct-name">${p.name} <span style="font-size:10px;color:rgba(253,208,35,0.6);font-family:'DM Mono',monospace;">(incoming)</span></td>
            <td>${p.ppg}</td><td>${p.rpg}</td><td>${p.apg}</td><td>${p.spg}</td><td>${p.bpg}</td><td>${p.fgpct}%</td>
          </tr>
          <tr>
            <td class="ct-name">${p.lsuComparison.player}</td>
            <td>${p.lsuComparison.ppg}</td><td>${p.lsuComparison.rpg}</td><td>${p.lsuComparison.apg}</td>
            <td>${p.lsuComparison.spg}</td><td>${p.lsuComparison.bpg}</td><td>${p.lsuComparison.fgpct}%</td>
          </tr>
        </tbody>
      </table>
    </div>` : ""}

    <!-- Skill Radar -->
    <div class="stat-two-col" style="margin-bottom:1.5rem;">
      <div class="glass-card">
        <div class="section-label" style="margin-bottom:12px;">Skill profile</div>
        <div class="radar-wrap">
          <canvas id="radarChart" role="img" aria-label="Skill profile radar chart">Skill radar.</canvas>
        </div>
      </div>
      <div class="glass-card">
        <div class="section-label" style="margin-bottom:10px;">Season accolades</div>
        ${p.accolades.map(a => `<div class="accolade-item"><span style="color:var(--gold);font-size:12px;flex-shrink:0;">★</span><span style="font-size:13px;color:rgba(240,234,248,0.65);line-height:1.45;">${a}</span></div>`).join("")}
      </div>
    </div>

    <!-- Momentum Tracker -->
    <div class="section-label" style="margin-bottom:8px;">Momentum tracker — 2025–26 season</div>
    <p class="section-intro">Season split into three phases based on their previous program's schedule. Each number is their PPG, RPG, or APG average during that stretch. Green dots = improvement vs. prior phase.</p>
    <div class="phase-legend">
      <div class="pl-item"><div class="pl-dot" style=""></div>Phase 1: Non-conference</div>
      <div class="pl-item"><div class="pl-dot" style="background:#378ADD;"></div>Phase 2: Conference 1st half</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--gold);"></div>Phase 3: Conference 2nd half + tournament</div>
    </div>
    <div class="phase-legend" style="margin-bottom:1rem;">
      <div class="pl-item"><div class="pl-dot" style="background:#1D9E75;"></div>Green = improved vs. prior phase</div>
      <div class="pl-item"><div class="pl-dot" style="background:#D85A30;"></div>Red = declined vs. prior phase</div>
      <div class="pl-item"><div class="pl-dot" style="background:rgba(255,255,255,0.25);"></div>Gray = within 0.5 — held steady</div>
    </div>
    <div class="glass-card" style="overflow-x:auto;">
      <table class="momentum-table" id="momentum-table">
        <thead><tr>
          <th>Stat</th>
          <th style="color:rgba(59,31,106,0.9);">Phase 1<br/><span style="font-size:9px;opacity:0.6;">Non-conf</span></th>
          <th style="color:#378ADD;">Phase 2<br/><span style="font-size:9px;opacity:0.6;">Conf 1st half</span></th>
          <th style="color:var(--gold);">Phase 3<br/><span style="font-size:9px;opacity:0.6;">Conf 2nd+</span></th>
          <th>Total Δ</th>
          <th>Trajectory</th>
        </tr></thead>
        <tbody id="momentum-body"></tbody>
      </table>
    </div>
  `;

  // Build radar
  const rCtx = document.getElementById("radarChart").getContext("2d");
  charts.radar = new Chart(rCtx, {
    type: "radar",
    data: {
      labels: ["Scoring","Rebounding","Playmaking","Defense","Efficiency","Athleticism"],
      datasets: [{
        data: p.radar,
        backgroundColor: "rgba(59,31,106,0.25)",
        borderColor: "var(--gold)", borderWidth:1.5,
        pointBackgroundColor:"var(--gold)", pointRadius:4
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{ r:{ min:0, max:100, ticks:{ display:false },
        pointLabels:{ font:{ size:11, family:"DM Mono" }, color:"rgba(240,234,248,0.42)" },
        grid:{ color:"rgba(255,255,255,0.06)" },
        angleLines:{ color:"rgba(255,255,255,0.06)" }
      }}
    }
  });

  // Build momentum table
  const rows = [
    { label:"Points (PPG)", phases: p.phases.ppg, unit:" ppg" },
    { label:"Rebounds (RPG)", phases: p.phases.rpg, unit:" rpg" },
    { label:"Assists (APG)", phases: p.phases.apg, unit:" apg" }
  ];
  document.getElementById("momentum-body").innerHTML = rows.map(r => {
    const [ph1, ph2, ph3] = r.phases;
    const dot2 = ph2 - ph1 >= 0.4 ? "#1D9E75" : ph2 - ph1 <= -0.4 ? "#D85A30" : "rgba(255,255,255,0.25)";
    const dot3 = ph3 - ph2 >= 0.4 ? "#1D9E75" : ph3 - ph2 <= -0.4 ? "#D85A30" : "rgba(255,255,255,0.25)";
    const delta = ph3 - ph1;
    const up = delta >= 0.5, dn = delta <= -0.5;
    const cls = up ? "m-up" : dn ? "m-down" : "m-flat";
    const arrow = up ? "↑" : dn ? "↓" : "→";
    const traj = up ? "Rising" : dn ? "Fading" : "Steady";
    return `<tr>
      <td style="font-weight:500;color:#fff;">${r.label}</td>
      <td><span class="m-val">${ph1.toFixed(1)}${r.unit}</span></td>
      <td><div class="m-phase-cell"><div class="m-dot" style="background:${dot2}"></div><span class="m-val">${ph2.toFixed(1)}${r.unit}</span></div></td>
      <td><div class="m-phase-cell"><div class="m-dot" style="background:${dot3}"></div><span class="m-val">${ph3.toFixed(1)}${r.unit}</span></div></td>
      <td class="${cls}" style="font-family:'DM Mono',monospace;font-size:12px;">${delta >= 0 ? "+" : ""}${delta.toFixed(1)}</td>
      <td class="${cls}" style="font-weight:500;">${arrow} ${traj}</td>
    </tr>`;
  }).join("");
}


function showPlayer(idx, btn) {
  document.querySelectorAll(".t-tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  destroyCharts();
  render(TRANSFERS[idx]);
}

// Init
render(TRANSFERS[0]);

</script>
<script>
function toggleNav() {
  const links = document.getElementById('topnav-links');
  const btn   = document.getElementById('nav-hamburger');
  links.classList.toggle('open');
  btn.classList.toggle('open');
}
// Close nav when a link is clicked (mobile)
document.querySelectorAll('.topnav-links a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('topnav-links').classList.remove('open');
    document.getElementById('nav-hamburger').classList.remove('open');
  });
});
</script>
</body>
